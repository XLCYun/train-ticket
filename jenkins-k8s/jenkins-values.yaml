controller:
  # 基本配置
  image:
    repository: jenkins/jenkins
    tag: "2.462.2-lts"
  
  # 管理员账户
  admin:
    username: "admin"
    password: "admin123"
  
  # 资源限制 (适合 minikube)
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  
  # 持久化存储
  persistence:
    enabled: true
    size: 8Gi
    storageClass: standard
  
  # 服务类型 (NodePort for minikube)
  serviceType: NodePort
  nodePort: 32000
  
  # 安装基本插件 (不指定版本)
  installPlugins:
    - kubernetes
    - workflow-job
    - workflow-aggregator
    - git
    - maven-plugin
    - junit
    - pipeline-stage-view
    - configuration-as-code
  
  # JVM 配置
  javaOpts: >-
    -Xmx1024m
    -Djava.awt.headless=true
    -Djenkins.install.runSetupWizard=false
    -Dhudson.security.csrf.GlobalCrumbIssuerConfiguration.DISABLE_CSRF_PROTECTION=true

# 关闭 agent
agent:
  enabled: false

# RBAC 配置
rbac:
  create: true
  readSecrets: true

serviceAccount:
  create: true
  name: jenkins

# 关闭网络策略
networkPolicy:
  enabled: false
